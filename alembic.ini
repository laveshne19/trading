[alembic]
script_location = src/trading_system/database/migrations
prepend_sys_path = src
version_path_separator = os
timezone = UTC

# Database URL is injected from env (DATABASE_URL) by env.py; this
# placeholder exists so `alembic current` doesn't fail before env.py runs.
sqlalchemy.url = driver://user:pass@host/db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
