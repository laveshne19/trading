version: '3.8'

services:
  tradingview-mcp:
    build: .
    image: atilaahmet/tradingview-mcp:latest
    container_name: tradingview-mcp
    ports:
      - "8080:8000"
    restart: unless-stopped
    environment:
      # Optional: Add any future API keys or environment variables here
      - PORT=8000
      - HOST=0.0.0.0

  # Postgres for the 9/21 EMA live-trading system (src/trading_system).
  # Start with: docker compose up -d postgres
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
    volumes:
      - trading_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trading_pg_data:
